<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
<title>SonarQube assessment workflow</title><desc>Follow the steps from the scan server to the dashboard.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#13203a"/><stop offset="1" stop-color="#0d1626"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#7fa2ff" stroke-width="1.5"/></marker>
</defs>
<style>
.connector { fill:none; stroke:#7fa2ff; stroke-width:2; stroke-linejoin:round; marker-end:url(#arrow); }
.connector-flow { fill:none; stroke:#e7edf6; stroke-width:3; stroke-linecap:round; stroke-dasharray:6 18; animation:connector-flow 1.8s linear infinite; }
@keyframes connector-flow { from { stroke-dashoffset:24; } to { stroke-dashoffset:0; } }
@media (prefers-reduced-motion:reduce) { .connector-flow { animation:none; opacity:0; } }
</style>
<rect width="640" height="360" rx="12" fill="url(#bg)"/>
<text x="24" y="36" fill="#eef2f7" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start">SonarQube assessment workflow</text><text x="24" y="64" fill="#a3b1c7" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" text-anchor="start">Follow the steps from the scan server to the dashboard.</text><path class="connector" d="M188 137H234"/><path class="connector-flow" d="M188 137H234" aria-hidden="true"/><path class="connector" d="M402 137H448"/><path class="connector-flow" d="M402 137H448" aria-hidden="true"/><path class="connector" d="M534 182V220"/><path class="connector-flow" d="M534 182V220" aria-hidden="true"/><path class="connector" d="M452 269H406"/><path class="connector-flow" d="M452 269H406" aria-hidden="true"/><rect x="24" y="92" width="164" height="90" rx="12" fill="#111e2f" stroke="#40536b"/><text x="38" y="115" fill="#7fa2ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start">1</text><text x="106.0" y="149.0" fill="#eef2f7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="middle">Scan server</text><rect x="238" y="92" width="164" height="90" rx="12" fill="#111e2f" stroke="#40536b"/><text x="252" y="115" fill="#7fa2ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start">2</text><text x="320.0" y="137.0" fill="#eef2f7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="middle">Repos cloned</text><text x="320.0" y="161.0" fill="#eef2f7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="middle">on server</text><rect x="452" y="92" width="164" height="90" rx="12" fill="#111e2f" stroke="#40536b"/><text x="466" y="115" fill="#7fa2ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start">3</text><text x="534.0" y="137.0" fill="#eef2f7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="middle">Run scan</text><text x="534.0" y="161.0" fill="#eef2f7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="middle">command</text><rect x="452" y="224" width="164" height="90" rx="12" fill="#111e2f" stroke="#40536b"/><text x="466" y="247" fill="#7fa2ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start">4</text><text x="534.0" y="281.0" fill="#eef2f7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="middle">Sonar scan</text><rect x="238" y="224" width="164" height="90" rx="12" fill="#111e2f" stroke="#40536b"/><text x="252" y="247" fill="#7fa2ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start">5</text><text x="320.0" y="269.0" fill="#eef2f7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="middle">SonarQube</text><text x="320.0" y="293.0" fill="#eef2f7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="middle">dashboard</text><text x="24" y="254" fill="#7fa2ff" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="start">Execution flow</text><text x="24" y="280" fill="#a3b1c7" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">Server to dashboard</text><path d="M24 326H616" stroke="#344254"/><text x="24" y="348" fill="#a3b1c7" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" text-anchor="start">Linux server / GitHub Enterprise / SonarQube</text>
</svg>
