<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
<title>Container delivery workflow</title><desc>Source moves through build, validation, and deployment.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#13203a"/><stop offset="1" stop-color="#0d1626"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#7fa2ff" stroke-width="1.5"/></marker>
</defs>
<style>
.connector { fill:none; stroke:#7fa2ff; stroke-width:2; stroke-linejoin:round; marker-end:url(#arrow); }
.connector-flow { fill:none; stroke:#e7edf6; stroke-width:3; stroke-linecap:round; stroke-dasharray:6 18; animation:connector-flow 1.8s linear infinite; }
@keyframes connector-flow { from { stroke-dashoffset:24; } to { stroke-dashoffset:0; } }
@media (prefers-reduced-motion:reduce) { .connector-flow { animation:none; opacity:0; } }
</style>
<rect width="640" height="360" rx="12" fill="url(#bg)"/>
<text x="24" y="36" fill="#eef2f7" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start">Container delivery workflow</text><text x="24" y="64" fill="#a3b1c7" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" text-anchor="start">Source moves through build, validation, and deployment.</text><path class="connector" d="M140 204H186"/><path class="connector-flow" d="M140 204H186" aria-hidden="true"/><path class="connector" d="M306 204H352"/><path class="connector-flow" d="M306 204H352" aria-hidden="true"/><path class="connector" d="M472 204H518"/><path class="connector-flow" d="M472 204H518" aria-hidden="true"/><rect x="24" y="150" width="116" height="108" rx="12" fill="#111e2f" stroke="#40536b"/><text x="38" y="173" fill="#7fa2ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start">1</text><text x="82.0" y="216.0" fill="#eef2f7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="middle">Source</text><rect x="190" y="150" width="116" height="108" rx="12" fill="#111e2f" stroke="#40536b"/><text x="204" y="173" fill="#7fa2ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start">2</text><text x="248.0" y="204.0" fill="#eef2f7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="middle">Docker</text><text x="248.0" y="228.0" fill="#eef2f7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="middle">build</text><rect x="356" y="150" width="116" height="108" rx="12" fill="#111e2f" stroke="#40536b"/><text x="370" y="173" fill="#7fa2ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start">3</text><text x="414.0" y="216.0" fill="#eef2f7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="middle">Validate</text><rect x="522" y="150" width="94" height="108" rx="12" fill="#111e2f" stroke="#40536b"/><text x="536" y="173" fill="#7fa2ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start">4</text><text x="569.0" y="216.0" fill="#eef2f7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="middle">Deploy</text><text x="320" y="301" fill="#a3b1c7" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" text-anchor="middle">Target environments: QA / UAT / Production</text><path d="M24 326H616" stroke="#344254"/><text x="24" y="348" fill="#a3b1c7" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" text-anchor="start">Docker / Jenkins / GitHub Actions</text>
</svg>
