-serif" font-size="20" font-weight="500" text-anchor="middle">Staging</text><rect x="456" y="265" width="160" height="48" rx="12" fill="#111e2f" stroke="#40536b"/><text x="536.0" y="296.0" fill="#eef2f7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="middle">Production</text><path d="M24 326H616" stroke="#344254"/><text x="24" y="348" fill="#a3b1c7" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" text-anchor="start">Terraform / CloudFormation / AWS CDK</text>
