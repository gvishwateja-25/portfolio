<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
<title>Multi-region AWS routing</title><desc>Requests reach a region through the routing layer.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#13203a"/><stop offset="1" stop-color="#0d1626"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#7fa2ff" stroke-width="1.5"/></marker>
</defs>
<style>
.connector { fill:none; stroke:#7fa2ff; stroke-width:2; stroke-linejoin:round; marker-end:url(#arrow); }
.connector-flow { fill:none; stroke:#e7edf6; stroke-width:3; stroke-linecap:round; stroke-dasharray:6 18; animation:connector-flow 1.8s linear infinite; }
@keyframes connector-flow { from { stroke-dashoffset:24; } to { stroke-dashoffset:0; } }
@media (prefers-reduced-motion:reduce) { .connector-flow { animation:none; opacity:0; } }
</style>
<rect width="640" height="360" rx="12" fill="url(#bg)"/>
<text x="24" y="36" fill="#eef2f7" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start">Multi-region AWS routing</text><text x="24" y="64" fill="#a3b1c7" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" text-anchor="start">Requests reach a region through the routing layer.</text><path class="connector" d="M178 200H236"/><path class="connector-flow" d="M178 200H236" aria-hidden="true"/><path class="connector" d="M394 200H425V145H452"/><path class="connector-flow" d="M394 200H425V145H452" aria-hidden="true"/><path class="connector" d="M425 200V257H452"/><path class="connector-flow" d="M425 200V257H452" aria-hidden="true"/><rect x="24" y="159" width="154" height="82" rx="12" fill="#111e2f" stroke="#40536b"/><text x="101.0" y="207.0" fill="#eef2f7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="middle">Requests</text><rect x="240" y="159" width="154" height="82" rx="12" fill="#111e2f" stroke="#40536b"/><text x="317.0" y="207.0" fill="#eef2f7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="middle">AWS routing</text><rect x="456" y="106" width="160" height="78" rx="12" fill="#111e2f" stroke="#40536b"/><text x="536.0" y="152.0" fill="#eef2f7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="middle">Region A</text><rect x="456" y="218" width="160" height="78" rx="12" fill="#111e2f" stroke="#40536b"/><text x="536.0" y="264.0" fill="#eef2f7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" text-anchor="middle">Region B</text><text x="536" y="207" fill="#a3b1c7" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" text-anchor="middle">Recovery route</text><path d="M24 326H616" stroke="#344254"/><text x="24" y="348" fill="#a3b1c7" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" text-anchor="start">Global Accelerator / Route 53 / CloudWatch</text>
</svg>
